<!DOCTYPE html>
<html>
<head>
  <title>Nietdiep.io</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    #game { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    #mapOverlay { z-index: 40; pointer-events: none; }
    #mapOverlay canvas { pointer-events: auto; }
    canvas { display: block; }
    #startMenu, #respawnMenu {
      position: absolute;
      z-index: 100;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff; 
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      display: none;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    #startMenu.show, #respawnMenu.show {
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translate(-50%, -40%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
    input { 
      margin: 10px; 
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
      backdrop-filter: blur(5px);
    }
    input:focus { outline: none; border-color: rgba(255, 255, 255, 0.6); }
    button { 
      margin-top: 15px; 
      padding: 12px 24px; 
      background: rgba(76, 175, 80, 0.8);
      color: white; 
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    button:hover { 
      background: rgba(76, 175, 80, 1);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
    }
    .upgrade-item { display: flex; flex-direction: column; align-items: center; }
    .upgrade-btn {
      background: rgba(76, 175, 80, 0.55);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 5px 4px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 11px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s;
      width: 100%;
    }
    .upgrade-btn:hover { background: rgba(76,175,80,0.9); }
    .upgrade-btn-2x {
      background: rgba(255, 152, 0, 0.55);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 2px 4px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 2px;
      font-size: 10px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.2s;
      width: 100%;
    }
    .upgrade-btn-2x:hover { background: rgba(255,152,0,0.9); }
    .upgrade-count { font-size: 11px; color: rgba(255,255,255,0.65); }

    /* --- Mobile controls --- */
    #joystickArea {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 200;
      width: 130px;
      height: 130px;
      touch-action: none;
    }
    #joystickBase {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
    }
    #joystickKnob {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.85);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.05s;
    }
    #shootBtn {
      display: none;
      position: fixed;
      bottom: 44px;
      right: 32px;
      z-index: 200;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: rgba(255, 60, 60, 0.82);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 28px;
      line-height: 86px;
      text-align: center;
      cursor: pointer;
      touch-action: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(255,60,60,0.35);
      user-select: none;
    }

    /* ---- Upgrade panel glass ---- */
    #upgradePanel {
      background: rgba(255,255,255,0.07) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid rgba(255,255,255,0.22) !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35) !important;
    }

    /* ---- Mobile layout ---- */
    @media (max-width: 768px) {
      #startMenu, #respawnMenu {
        width: 90vw !important;
        max-width: 400px !important;
        padding: 18px !important;
        max-height: 90vh !important;
        overflow-y: auto !important;
        box-sizing: border-box !important;
      }
      #startMenu input, #respawnMenu input {
        width: calc(100% - 20px) !important;
        box-sizing: border-box !important;
        font-size: 14px !important;
      }
      /* Move upgrade panel to top so it doesn't clash with joystick */
      #upgradePanel {
        left: 10px !important;
        bottom: auto !important;
        top: 10px !important;
        width: calc(100vw - 20px) !important;
        max-width: 360px !important;
        max-height: 44vh !important;
        overflow-y: auto !important;
        padding: 8px !important;
        font-size: 11px !important;
      }
      #upgradePanel > div:first-child {
        margin-bottom: 5px !important;
        font-size: 12px !important;
      }
      /* Compact upgrade grid — 4 columns on mobile */
      #upgradePanel > div:last-child {
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 4px !important;
      }
    }

    @media (max-width: 400px) {
      /* Very small phones: 4 cols still, even smaller text */
      #upgradePanel > div:last-child {
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 3px !important;
      }
      .upgrade-btn { font-size: 9px !important; padding: 3px 2px !important; }
      .upgrade-btn-2x { font-size: 8px !important; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="mapOverlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 50;">
    <canvas id="mapCanvas" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px;"></canvas>
  </div>

  <div id="startMenu">
    <h2>Nietdiep.io</h2>
    <input type="text" id="nameInput" placeholder="Name" maxlength="25" />
    <input type="color" id="colorInput" value="#4caf50" />
    <br/>
    <p style="color:#ccc; margin: 10px 0;">Press START to join the arena.</p>
    <button id="startBtn">Start</button>
    <button id="shopBtn" style="background: rgba(255, 152, 0, 0.8); margin-left: 10px;">🛍️ Shop</button>
  </div>

  <div id="respawnMenu">
    <h2>You Died!</h2>
    <p style="color:#ccc; margin: 20px 0; font-size: 18px;">Press RESPAWN to try again.</p>
    <button id="respawnBtn">Respawn</button>
    <button id="respawnShopBtn" style="background: rgba(255, 152, 0, 0.8); margin-left: 10px;">🛍️ Shop</button>
  </div>

  <div id="upgradePanel" style="display:none; position: absolute; left: 20px; bottom: 20px; color: #fff; padding: 10px; width: 300px; font-family: sans-serif; z-index:100; border-radius: 12px;">
    <div style="margin-bottom:8px;"><strong>Upgrade punten: <span id="upgradePoints">0</span></strong></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
      <div class="upgrade-item">
        <button data-stat="damage" class="upgrade-btn">Damage</button>
        <button data-stat="damage" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-damage">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="power" class="upgrade-btn">Power</button>
        <button data-stat="power" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-power">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="bulletSpeed" class="upgrade-btn">Bullet Speed</button>
        <button data-stat="bulletSpeed" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-bulletSpeed">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="fireRate" class="upgrade-btn">Fire Rate</button>
        <button data-stat="fireRate" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-fireRate">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="bodyDamage" class="upgrade-btn">Body Damage</button>
        <button data-stat="bodyDamage" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-bodyDamage">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="regenerationRate" class="upgrade-btn">Regen</button>
        <button data-stat="regenerationRate" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-regenerationRate">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="speed" class="upgrade-btn">Speed</button>
        <button data-stat="speed" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-speed">0</span>
      </div>
      <div class="upgrade-item">
        <button data-stat="maxHealth" class="upgrade-btn">Max Health</button>
        <button data-stat="maxHealth" data-multi="2" class="upgrade-btn-2x">2x</button>
        <span class="upgrade-count" id="count-maxHealth">0</span>
      </div>
    </div>
  </div>

  <!-- Mobile joystick & shoot button -->
  <div id="joystickArea">
    <div id="joystickBase">
      <div id="joystickKnob"></div>
    </div>
  </div>
  <div id="shootBtn">🔫</div>

  <script type="module" src="client/main.js"></script>
</body>
</html>
