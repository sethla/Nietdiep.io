<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nietdiep.io</title>
  <style>
    body { margin:0; overflow:hidden; background:#111; font-family:sans-serif; color:white; }
    canvas { display:block; }
    #startMenu {
      position:absolute; top:0; left:0; width:100%; height:100%;
      background:#111; display:flex; flex-direction:column; justify-content:center; align-items:center;
    }
    #chat {
      position:absolute; bottom:0; left:0; width:300px; max-height:200px; overflow-y:auto;
      background:rgba(0,0,0,0.6); padding:5px; font-size:14px;
    }
    #chatInput {
      position:absolute; bottom:0; left:0; width:300px; box-sizing:border-box;
    }
  </style>
</head>
<body>
  <div id="startMenu">
    <input id="nameInput" placeholder="Name (max 15)" maxlength="15">
    <input id="colorInput" type="color" value="#4caf50">
    <button id="startBtn">Start</button>
  </div>
  <canvas id="game"></canvas>
  <div id="chat"></div>
  <input id="chatInput" placeholder="Type message..." maxlength="100">
  <script type="module" src="client/main.js"></script>
</body>
</html>
