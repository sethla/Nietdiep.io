<!DOCTYPE html>
<html>
<head>
  <title>Nietdiep.io</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #startMenu, #respawnMenu {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #222; color: #fff; padding: 20px;
      border: 2px solid #fff; display: none;
      text-align: center;
    }
    input { margin: 5px; }
    button { margin-top: 10px; padding: 5px 10px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="startMenu">
    <h2>Nietdiep.io</h2>
    <input type="text" id="nameInput" placeholder="Name" />
    <input type="color" id="colorInput" value="#4caf50" />
    <br/>
    <button id="startBtn">Start</button>
  </div>

  <div id="respawnMenu">
    <h2>You Died!</h2>
    <button id="respawnBtn">Respawn</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
